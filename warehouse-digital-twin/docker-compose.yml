services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warehouse_twin
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
volumes:
  mysql-data:
  redis-data:
