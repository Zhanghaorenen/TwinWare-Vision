spring:
  datasource:
    url: jdbc:h2:mem:warehouse;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-demo.sql
      data-locations: classpath:data-demo.sql
  data:
    redis:
      repositories:
        enabled: false
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
warehouse:
  state:
    redis-enabled: false
